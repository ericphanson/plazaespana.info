name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: generator/go.sum

      - name: Cache HTTP data
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/http-cache
          # Use static cache key with version number
          # All builds share the same cache, relying on code's cache TTL for freshness
          # Prevents AEMET rate limiting by reusing cached data across multiple CI runs
          # Bump version number (v1 -> v2) to invalidate cache if needed
          key: http-cache-v1
          restore-keys: |
            http-cache-v

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install Janet/JPM
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

          git clone --depth=1 --branch v1.41.2 https://github.com/janet-lang/janet.git /tmp/janet
          make -C /tmp/janet
          sudo make -C /tmp/janet install
          sudo make -C /tmp/janet install-jpm-git

          janet -v
          command -v jpm >/dev/null

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.15.2

      - name: Verify Zig
        run: zig version

      - name: Check formatting
        run: just fmt-check

      - name: Run tests
        env:
          PLAZAESPANA_NO_API: "1"  # Block all external API calls - tests must use fixtures
        run: just test

      - name: Run log-analyzer tests
        run: cd log-analyzer && just test

      - name: Build FreeBSD binary
        run: just freebsd

      - name: Build log-analyzer FreeBSD binary
        run: just log-analyzer-freebsd

      - name: Upload FreeBSD binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: buildsite-freebsd
          path: build/buildsite
          retention-days: 1

      - name: Upload log-analyzer FreeBSD binary
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-analyzer-freebsd
          path: log-analyzer/build/log-analyzer-freebsd
          retention-days: 1

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: generator/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Run integration tests (with HTML validation)
        env:
          PLAZAESPANA_NO_API: "1"  # Block all external API calls - tests must use mocks
        run: just test-integration

  deploy:
    name: Deploy to NFSN
    runs-on: ubuntu-latest
    needs: build-and-test
    # Only deploy from the original repository, not from forks
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'ericphanson/plazaespana.info'
    env:
      NFSN_HOST: ${{ secrets.NFSN_HOST }}
      NFSN_USER: ${{ secrets.NFSN_USER }}
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}  # Required: for weather forecasts
      BUNNY_STORAGE_KEY: ${{ secrets.BUNNY_STORAGE_KEY }}
      BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
      BUNNY_STORAGE_ENDPOINT: ${{ secrets.BUNNY_STORAGE_ENDPOINT }}
      BUNNY_BASE_PATH: ${{ secrets.BUNNY_BASE_PATH }}

    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Download FreeBSD binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: buildsite-freebsd
          path: build/

      - name: Download log-analyzer FreeBSD binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: log-analyzer-freebsd
          path: log-analyzer/build/

      - name: Restore binary execute permissions
        run: |
          chmod +x build/buildsite log-analyzer/build/log-analyzer-freebsd
          ls -l build/buildsite log-analyzer/build/log-analyzer-freebsd

      - name: Hash CSS
        run: just hash-css

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NFSN_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.NFSN_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to NFSN
        run: just deploy-only
