name: Check Analytics Freshness

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify analytics manifest freshness
        run: |
          python3 scripts/check-analytics-staleness.py \
            --manifest-url "https://plazaespana.info/analytics-report.html" \
            --max-age-days 3
