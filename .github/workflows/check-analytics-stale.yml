name: Check Analytics Freshness

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify analytics manifest freshness
        run: |
          python3 scripts/check-analytics-staleness.py \
            --manifest-url "https://plazaespana.info/analytics-report.html" \
            --max-age-days 3
