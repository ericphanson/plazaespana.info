name: Check Analytics Freshness

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Verify analytics manifest freshness
        run: |
          python3 scripts/check-analytics-staleness.py \
            --manifest-url "https://plazaespana.info/analytics/data/manifest.json" \
            --max-age-days 3
