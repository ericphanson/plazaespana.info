name: Fetch Log Analyzer Stats

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: log-analyzer-fetch
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-stats:
    name: Fetch and archive log-analyzer aggregate snapshots
    runs-on: ubuntu-latest
    if: github.repository == 'ericphanson/plazaespana.info'

    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Setup SSH for NFSN
        env:
          NFSN_SSH_KEY: ${{ secrets.NFSN_SSH_KEY }}
          NFSN_HOST: ${{ secrets.NFSN_HOST }}
          NFSN_KNOWN_HOST: ${{ secrets.NFSN_KNOWN_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$NFSN_SSH_KEY" > ~/.ssh/nfsn_stats
          chmod 600 ~/.ssh/nfsn_stats
          echo "$NFSN_KNOWN_HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host $NFSN_HOST
            IdentityFile ~/.ssh/nfsn_stats
          EOF

      - name: Setup Just
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3

      - name: Configure Git
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Fetch log-analyzer stats and update/create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NFSN_HOST: ${{ secrets.NFSN_HOST }}
          NFSN_USER: ${{ secrets.NFSN_USER }}
        run: |
          just fetch-log-analyzer-stats
